# Foundation Data Pipeline - local database
# PostgreSQL 18 with pgvector pre-built (the vanilla postgres image has no pgvector).
services:
  db:
    image: pgvector/pgvector:pg18
    container_name: olist-foundation-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port is 5433 because another project already uses 5432.
      - "${HOST_PORT}:5432"
    volumes:
      # PG18 changed this: the mount goes at /var/lib/postgresql, NOT .../data.
      # The image stores data in a version-specific subdirectory beneath it,
      # and refuses to start if it finds a volume mounted at the old path.
      - pgdata:/var/lib/postgresql
      # Mounted read-only so the server can COPY the CSVs directly from disk,
      # which is far faster than streaming 1M geolocation rows through the client.
      - ./data/raw:/data/raw:ro
      - ./migrations:/migrations:ro
      - ./seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
